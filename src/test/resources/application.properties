# Ce fichier masque celui de src/main pendant les tests. Volontairement : les
# tests tournent sur une base H2 en memoire, jamais sur student_tracker. Sinon
# un simple ./mvnw package viderait la table qui sert aux captures.
spring.datasource.url=jdbc:h2:mem:student_tracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.jpa.hibernate.ddl-auto=create-drop
spring.main.banner-mode=off
logging.level.root=warn
