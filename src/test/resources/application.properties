# Les tests tournent sur une base H2 en memoire, jamais sur student_tracker :
# sinon un simple ./mvnw package viderait la table qui sert aux captures.
#
# Ce fichier est charge par @TestPropertySource sur chaque classe de test, et non
# par le seul mecanisme ordinaire. Une variable SPRING_DATASOURCE_URL exportee
# dans le terminal l'emporterait sinon sur lui, et les tests viseraient MySQL.
spring.datasource.url=jdbc:h2:mem:student_tracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.main.banner-mode=off
logging.level.root=warn
